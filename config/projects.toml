# ctx project configuration.
#
# Groups directories into projects and overrides seeded defaults.
# - `roots` are absolute paths; an event is linked to the project whose root is the
#   LONGEST PREFIX of the event's working directory (so one root covers its subtree,
#   and a deeper root on another project shadows the shallower one).
# - `allowed = true` makes a project searchable and usable by features.
#   The 12 directories observed during Phase 0 were explicitly approved (ADR-002)
#   and start allowed; any project discovered later starts allowed = false.
# - `local_only` (default true) forbids cloud LLM calls for that project (ADR-003).

[projects.sar-images]
name = "SAR Images"
allowed = true
roots = [
    "/Users/himanshu/Desktop/SAR Images",
]

